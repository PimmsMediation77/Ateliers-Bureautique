name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test atelier-core
        run: npm run core:test

      - name: Test ateliers (runtime, encodage, tests)
        run: |
          npm run word:test
          npm run excel:test
          npm run powerpoint:test

      - name: Build app/ (non versionne)
        run: npm run apps:sync

      - name: Check sources unchanged by sync
        run: git diff --exit-code -- apps packages

      - name: Validate app sync
        run: |
          npm run word:validate:app-sync
          npm run excel:validate:app-sync
          npm run powerpoint:validate:app-sync

      - name: Check download asset links
        run: npm run assets:check-links

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist/word dist/excel dist/powerpoint
          cp -R pages/. dist/
          cp -R apps/word/app/. dist/word/
          cp -R apps/excel/app/. dist/excel/
          cp -R apps/powerpoint/app/. dist/powerpoint/
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
